# ─────────────────────────────────────────────────────────────────────────────
# QMDJ Calendar — CI
#
# Matches the repo as it actually is today: a single-package Vite + React app
# with the Zhirun engine vendored under src/engine/. Two gates that mean
# something and stay green:
#   1. typecheck  — tsc --noEmit over src/ (catches engine + UI type breaks)
#   2. fixtures   — golden fixture schema + provenance gate (no-fabrication rule)
#   3. tests      — Vitest: golden truth, engine invariants, calendar/scoring
#   4. build      — vite build must produce a production bundle
#
# The build artifact is uploaded so you can preview any commit's output.
#
# Runs on PRs into main, on pushes to main, and on demand.
#
# HARDENING (later, not blocking):
#   • Boundary layer (L2): solar-term ±1min, 晚子时, 换旬 — not written yet.
#   • Parity (L4) and perf budgets (L5) as they land.
#   • Cross-check the golden fixtures against a SECOND independent reference —
#     they currently carry one source each, so the validator warns by design.
#   • Add a deploy job when a production host is chosen.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Validate golden fixtures (schema + provenance)
        run: npm run test:fixtures

      - name: Unit tests (Vitest — golden fixtures + engine invariants)
        run: npm test

      - name: Build (vite)
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: qmdj-calendar-dist-${{ github.sha }}
          path: dist
          retention-days: 14
